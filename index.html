<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Todo List</h1>
    <form id="form">
      <input id="input" placeholder="What needs doing?" autocomplete="off" aria-label="New task">
      <button type="submit">Add</button>
    </form>
    <nav>
      <button data-filter="all" class="active">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="done">Done</button>
    </nav>
    <ul id="list"></ul>
    <footer><span id="count"></span><button id="clear">Clear done</button></footer>
    <p class="hint">Saved in your browser.</p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
